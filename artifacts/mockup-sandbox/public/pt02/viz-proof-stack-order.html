<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FDI · Proof Stack Order</title>
<link rel="stylesheet" href="/__mockup/ads/brand.css" />
<style>
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:5vw 5.4vw 4.2vw;}
  .keyb{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.26em;
    color:var(--faded);font-size:1.6vw;display:flex;align-items:center;gap:.9em;margin-bottom:1.8vw;}
  .keyb::before{content:"";width:.95em;height:.62em;background:var(--signal-orange);flex:none;}
  .htitle{font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--cream);
    font-size:7.2vw;letter-spacing:-.02em;line-height:1.02;margin-bottom:3vw;}
  .htitle em{font-style:normal;color:var(--amber);}
  .stackv{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:1.6vw;}
  .brick{flex:1;display:flex;align-items:center;gap:2vw;
    border:2px solid var(--amber-press);border-radius:0;padding:2vw 2.4vw;
    background:linear-gradient(180deg, rgba(255,177,43,.08), transparent 70%), var(--surface);}
  .brick.dim{border-color:var(--border);background:var(--surface);}
  .num{font-family:'JetBrains Mono',monospace;color:var(--amber);font-size:3.6vw;font-weight:700;flex:none;}
  .dim .num{color:var(--muted);}
  .name{font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--cream);font-size:3.1vw;line-height:1.1;}
  .dim .name{color:var(--faded);}
  .ad .wrap .foot{margin-top:auto;padding-top:2.6vw;font-family:'Space Grotesk',sans-serif;
    color:var(--faded);font-size:2.3vw;line-height:1.3;display:block;}
  .foot b{color:var(--amber);font-weight:600;}
</style>
</head>
<body>
<div class="ad"><div class="wrap">
  <div class="keyb">Performance Thinking · Narrative</div>
  <div class="htitle">Receipts first,<br/><em>vision last.</em></div>
  <div class="stackv">
    <div class="brick"><span class="num">01</span><span class="name">Partnerships with teeth</span></div>
    <div class="brick"><span class="num">02</span><span class="name">Hard data</span></div>
    <div class="brick"><span class="num">03</span><span class="name">Unmanufactured product-market fit</span></div>
    <div class="brick"><span class="num">04</span><span class="name">Third-party validation</span></div>
    <div class="brick dim"><span class="num">05</span><span class="name">Then, and only then, the roadmap</span></div>
  </div>
  <div class="foot">The comms playbook after trust collapsed: <b>show, don't promise</b> (a16z crypto).</div>
</div></div>
</body>
</html>
