<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDI — GitHub Social Preview</title>
<link rel="stylesheet" href="/__mockup/channel/channel.css">
<style>
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  .og { position: relative; width: 100vw; height: 100vh; background: var(--base); overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between; padding: 8vh 6vw; }
  .og .tex { position: absolute; inset: 0; opacity: .3;
    background: url('/__mockup/images/constellation-h.png') center / cover no-repeat; }
  .og .scrim { position: absolute; inset: 0; background:
    linear-gradient(180deg, rgba(13,11,8,.7) 0%, rgba(13,11,8,.25) 40%, rgba(13,11,8,.92) 100%); }
  .og .lockup { position: relative; font-size: 7vh; color: var(--cream); }
  .og .mid { position: relative; }
  .og .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 3.6vh; letter-spacing: .26em;
    text-transform: uppercase; color: var(--faded); display: flex; align-items: center; gap: .9em; margin-bottom: 3vh; }
  .og .eyebrow::before { content: ""; width: 2.2em; border-top: 2px solid var(--amber); }
  .og .h { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 12vh;
    color: var(--cream); letter-spacing: -.015em; line-height: 1; }
  .og .d { font-family: 'Inter', sans-serif; font-size: 4.2vh; color: var(--faded); margin-top: 3vh; max-width: 24em; }
  .og .foot { position: relative; font-family: 'JetBrains Mono', monospace; font-size: 3.2vh;
    letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
<div class="og">
  <div class="tex"></div>
  <div class="scrim"></div>
  <div class="lockup">
    <svg class="mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path class="ln1" d="M10 70 L90 70"/><path class="ln2" d="M10 80 L90 80"/><path class="ln3" d="M10 90 L90 90"/><circle class="ring" cx="50" cy="48" r="22"/><path class="sun" d="M28 48 A22 22 0 0 0 72 48 Z"/></svg>
    <span class="wm">False Dawn Industries</span>
  </div>
  <div class="mid">
    <div class="eyebrow">System Dynamics Engine</div>
    <div class="h">Chart the network.</div>
    <div class="d">Cohort analysis and growth forecasting for unmapped markets.</div>
  </div>
  <div class="foot">github.com/false-dawn</div>
</div>
</body>
</html>
