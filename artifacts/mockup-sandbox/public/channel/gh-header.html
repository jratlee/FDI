<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDI — GitHub Header</title>
<link rel="stylesheet" href="/__mockup/channel/channel.css">
<style>
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  .gh { position: relative; width: 100vw; height: 100vh; background: var(--base);
    display: flex; flex-direction: column; justify-content: center; gap: 4vh; padding: 0 6vw; overflow: hidden; }
  .gh .tex { position: absolute; inset: 0; opacity: .25;
    background: url('/__mockup/images/constellation-h.png') center / cover no-repeat;
    -webkit-mask-image: linear-gradient(90deg, transparent 30%, #000 130%);
            mask-image: linear-gradient(90deg, transparent 30%, #000 130%); }
  .gh .scrim { position: absolute; inset: 0; background: linear-gradient(90deg, var(--base) 42%, rgba(13,11,8,.3) 100%); }
  .gh .lockup { position: relative; font-size: 17vh; color: var(--cream); }
  .gh .tline { position: relative; font-family: 'Space Grotesk', sans-serif; font-weight: 500;
    font-size: 19vh; color: var(--cream); letter-spacing: -.01em; line-height: 1.02; }
  .gh .sub { position: relative; font-family: 'JetBrains Mono', monospace; font-size: 7vh;
    letter-spacing: .2em; text-transform: uppercase; color: var(--amber); }
</style>
</head>
<body>
<div class="gh">
  <div class="tex"></div>
  <div class="scrim"></div>
  <div class="lockup">
    <svg class="mark" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path class="arc" d="M12 50 A38 38 0 0 1 88 50"/><path class="fill" d="M12 50 A38 38 0 0 0 88 50 Z"/></svg>
    <span class="wm">False Dawn Industries</span>
  </div>
  <div class="tline">Open instruments for system dynamics.</div>
  <div class="sub">Cohort analysis &middot; Growth forecasting</div>
</div>
</body>
</html>
