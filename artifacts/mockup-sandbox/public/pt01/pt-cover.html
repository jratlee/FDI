<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FDI · Performance Thinking Cover</title>
<link rel="stylesheet" href="/__mockup/ads/brand.css" />
<style>
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:4.2vw 4.6vw 3.6vw;}
  .top{display:flex;align-items:center;justify-content:space-between;}
  .top .lockup{font-size:1.55vw;}
  .corner{font-family:'JetBrains Mono',monospace;font-size:.95vw;letter-spacing:.22em;
    color:var(--muted);text-transform:uppercase;text-align:right;}
  .mid{flex:1;display:flex;align-items:center;gap:4vw;}
  .txt{flex:1.15;}
  .keyb{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.26em;
    color:var(--faded);font-size:1.05vw;display:flex;align-items:center;gap:.9em;margin-bottom:2vw;}
  .keyb::before{content:"";width:.95em;height:.62em;background:var(--signal-orange);flex:none;}
  .htitle{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--cream);
    font-size:5.4vw;letter-spacing:-.04em;line-height:.95;text-transform:uppercase;
    text-shadow:0 0 20px rgba(255,177,43,.4);}
  .htitle em{font-style:normal;color:var(--amber);}
  .sub{font-family:'Inter',sans-serif;color:var(--faded);font-size:1.5vw;line-height:1.5;
    margin-top:1.8vw;max-width:26em;}
  .stage{flex:.85;display:flex;align-items:center;justify-content:center;}
  .stage svg{width:100%;max-width:24vw;overflow:visible;}
  .hg{fill:rgba(255,177,43,.1);stroke:var(--amber);stroke-width:2.5;}
  .hgline{stroke:var(--hairline);stroke-width:1.6;}
  .dot{fill:var(--amber);}
  .dotf{fill:var(--faded);}
  .foot{display:flex;align-items:center;gap:1.1em;}
  .tick{width:.8vw;height:.55vw;background:var(--signal-orange);flex:none;}
  .metaline{font-size:1vw;}
</style>
</head>
<body>
<div class="ad"><div class="wrap">
  <div class="top">
    <span class="lockup"><span class="wm">False Dawn Industries</span><svg class="mark" viewBox="0 0 100 100" fill="none"><path class="arc" d="M12 50 A38 38 0 0 1 88 50"/><path class="fill" d="M12 50 A38 38 0 0 0 88 50 Z"/></svg></span>
    <div class="corner">Performance Thinking<br/>Edition · Org Design</div>
  </div>
  <div class="mid">
    <div class="txt">
      <div class="keyb">Growth Cartography · The agentic org</div>
      <div class="htitle">The <em>Hourglass</em> bet</div>
      <div class="sub">Why cutting junior roles is the cheapest decision you can make this year, and the one that bankrupts your talent pipeline by 2034.</div>
    </div>
    <div class="stage">
      <svg viewBox="0 0 200 220">
        <path class="hg" d="M40 12 h120 l-42 86 v14 l42 86 h-120 l42 -86 v-14 Z"/>
        <path class="hgline" d="M40 12 h120 M40 198 h120"/>
        <circle class="dot" cx="78" cy="34" r="6"/><circle class="dot" cx="100" cy="34" r="6"/><circle class="dot" cx="122" cy="34" r="6"/>
        <circle class="dot" cx="89" cy="56" r="6"/><circle class="dot" cx="111" cy="56" r="6"/>
        <circle class="dotf" cx="100" cy="105" r="5"/>
        <circle class="dotf" cx="88" cy="164" r="5"/><circle class="dotf" cx="112" cy="164" r="5"/>
        <circle class="dotf" cx="76" cy="184" r="5"/><circle class="dotf" cx="100" cy="184" r="5"/><circle class="dotf" cx="124" cy="184" r="5"/>
      </svg>
    </div>
  </div>
  <div class="foot"><span class="tick"></span><span class="metaline">People · Process · Products · The 90-day plan</span></div>
</div></div>
</body>
</html>
