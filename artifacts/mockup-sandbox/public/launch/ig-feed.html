<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FDI Launch · IG Feed 1080x1350</title>
<link rel="stylesheet" href="/__mockup/ads/brand.css" />
<style>
  .frame { position: absolute; inset: 0; display: flex; flex-direction: column;
    justify-content: space-between; padding: 7vw; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .lockup { font-size: 3.4vw; }
  .corner { font-family: 'JetBrains Mono', monospace; font-size: 1.8vw; letter-spacing: .22em;
    color: var(--muted); text-transform: uppercase; }
  .mid .eyebrow { font-size: 2.1vw; margin-bottom: 4.5vw; }
  .statpair { display: flex; flex-direction: column; gap: 4.5vw; }
  .stat { border-left: .45vw solid var(--amber); padding-left: 4vw; }
  .stat.dim { border-left-color: var(--hairline); }
  .num { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15.5vw;
    line-height: .95; letter-spacing: -.03em; color: var(--amber); }
  .stat.dim .num { color: var(--faded); }
  .lbl { font-family: 'Inter', sans-serif; font-size: 2.7vw; color: var(--faded);
    margin-top: 2.2vw; line-height: 1.45; max-width: 24em; }
  .foot { display: flex; align-items: center; justify-content: space-between; }
  .metaline { font-size: 1.9vw; }
  .cta { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 2.4vw;
    color: var(--cream); }
  .cta span { color: var(--amber); }
</style>
</head>
<body>
<div class="ad">
  <div class="frame">
    <div class="top">
      <div class="lockup"><span class="wm">False Dawn Industries</span>
        <svg class="mark" viewBox="0 0 100 100" fill="none"><path class="arc" d="M12 50 A38 38 0 0 1 88 50"/><path class="fill" d="M12 50 A38 38 0 0 0 88 50 Z"/></svg>
      </div>
      <div class="corner">Field Guide 001</div>
    </div>
    <div class="mid">
      <div class="eyebrow">Growth Cartography</div>
      <div class="statpair">
        <div class="stat dim">
          <div class="num">$1.3T</div>
          <div class="lbl">what the world will spend on advertising in 2026</div>
        </div>
        <div class="stat">
          <div class="num">2.5s</div>
          <div class="lbl">active attention the average digital ad actually earns</div>
        </div>
      </div>
    </div>
    <div class="foot">
      <div class="cta">The map is live. <span>Link in bio.</span></div>
      <div class="metaline">The CMO's Field Guide</div>
    </div>
  </div>
</div>
</body>
</html>
