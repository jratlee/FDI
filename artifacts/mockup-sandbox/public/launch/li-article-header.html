<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FDI Launch · LinkedIn Article Header 1200x627</title>
<link rel="stylesheet" href="/__mockup/ads/brand.css" />
<style>
  .frame { position: absolute; inset: 0; display: flex; flex-direction: column;
    justify-content: space-between; padding: 5.4vw 5.4vw 5vw; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .lockup { font-size: 2.5vw; }
  .corner { font-family: 'JetBrains Mono', monospace; font-size: 1.35vw; letter-spacing: .22em;
    color: var(--muted); text-transform: uppercase; }
  .mid { display: flex; align-items: center; justify-content: space-between; gap: 3vw; }
  .headline { font-size: 6.6vw; max-width: 9.5em; flex: 1 1 58%; }
  .headline em { font-style: normal; color: var(--amber); }
  .machine { flex: 0 0 34%; height: 24vw; display: flex; align-items: center; justify-content: center; }
  .machine svg { width: 100%; height: 100%; overflow: visible; }
  .m-ed { stroke: var(--hairline); stroke-width: 2; fill: none; }
  .m-ed.on { stroke: var(--amber); stroke-width: 2.6; }
  .m-nd { fill: var(--elevated); stroke: var(--muted); stroke-width: 1.8; }
  .m-nd.on { fill: #241b10; stroke: var(--amber); stroke-width: 2.2; }
  .m-core { fill: var(--amber); }
  .foot { display: flex; align-items: center; justify-content: space-between; }
  .metaline { font-size: 1.35vw; }
  .stack { font-family: 'JetBrains Mono', monospace; font-size: 1.55vw; letter-spacing: .1em;
    color: var(--faded); }
  .stack b { color: var(--amber); font-weight: 700; }
</style>
</head>
<body>
<div class="ad">
  <div class="frame">
    <div class="top">
      <div class="lockup"><span class="wm">False Dawn Industries</span>
        <svg class="mark" viewBox="0 0 100 100" fill="none"><path class="arc" d="M12 50 A38 38 0 0 1 88 50"/><path class="fill" d="M12 50 A38 38 0 0 0 88 50 Z"/></svg>
      </div>
      <div class="corner">Growth Cartography · The Thesis</div>
    </div>
    <div class="mid">
      <h1 class="headline">Build the machine, <em>not the ad</em>.</h1>
      <div class="machine">
        <svg viewBox="0 0 200 200">
          <path class="m-ed" d="M40 40 L100 100 M160 40 L100 100 M40 160 L100 100 M160 160 L100 100"/>
          <path class="m-ed on" d="M40 40 L160 40 M160 40 L160 160 M40 160 L100 100"/>
          <path class="m-ed" d="M40 40 L40 160 M160 160 L40 160"/>
          <circle class="m-nd" cx="40" cy="40" r="13"/>
          <circle class="m-nd on" cx="160" cy="40" r="13"/>
          <circle class="m-nd" cx="40" cy="160" r="13"/>
          <circle class="m-nd" cx="160" cy="160" r="13"/>
          <circle class="m-nd on" cx="100" cy="100" r="20"/>
          <circle class="m-core" cx="100" cy="100" r="8"/>
        </svg>
      </div>
    </div>
    <div class="foot">
      <div class="stack"><b>Aggregated</b> · <b>Decentralized</b> · <b>Autonomous</b></div>
      <div class="metaline">falsedawn.industries</div>
    </div>
  </div>
</div>
</body>
</html>
