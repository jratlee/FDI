<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FDI Launch — Story 2</title>
<link rel="stylesheet" href="/__mockup/ads/brand.css" />
<style>
  .band { position: absolute; left: 8vw; right: 8vw; top: 14vh; height: 66vh;
    display: flex; flex-direction: column; justify-content: center; }
  .brandrow { position: absolute; top: 16vh; left: 8vw; right: 8vw;
    display: flex; align-items: center; justify-content: space-between; }
  .lockup { font-size: 4.4vw; }
  .corner { font-family: 'JetBrains Mono', monospace; font-size: 2.4vw; letter-spacing: .22em;
    color: var(--muted); text-transform: uppercase; }
  .eyebrow { font-size: 2.9vw; margin-bottom: 6vw; }
  .headline { font-size: 9.6vw; max-width: 9.5em; }
  .headline em { font-style: normal; color: var(--amber); }
  .sub { font-family: 'Inter', sans-serif; font-size: 3.6vw; color: var(--faded);
    line-height: 1.45; margin-top: 6vw; max-width: 22em; }
  .hint { position: absolute; bottom: 22vh; left: 8vw; font-family: 'JetBrains Mono', monospace;
    font-size: 2.4vw; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
<div class="ad">
  <div class="brandrow">
    <div class="lockup"><span class="wm">False Dawn Industries</span>
      <svg class="mark" viewBox="0 0 100 100" fill="none"><path class="arc" d="M12 50 A38 38 0 0 1 88 50"/><path class="fill" d="M12 50 A38 38 0 0 0 88 50 Z"/></svg>
    </div>
    <div class="corner">2/3</div>
  </div>
  <div class="band">
    <div class="eyebrow">The leak in the map</div>
    <h1 class="headline">Every cohort you buy starts <em>decaying on day one.</em></h1>
    <p class="sub">Acquisition-only budgets refill a leaking map.</p>
  </div>
  <div class="hint">One more →</div>
</div>
</body>
</html>
